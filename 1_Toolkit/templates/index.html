<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptography Toolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-container { max-width: 1000px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .header-title { text-align: center; margin-bottom: 30px; }
        .nav-pills .nav-link { border-radius: 8px; font-weight: 600; color: #6c757d; margin: 0 5px; }
        .nav-pills .nav-link.active { background-color: #2b67f6; color: white; }
        .crypto-section { padding: 25px; border: 1px solid #eef0f2; border-radius: 12px; margin-top: 20px; }
        .result-box { background: #f1f4f9; padding: 15px; border-radius: 8px; min-height: 60px; word-break: break-all; margin-top: 15px; position: relative; }
        .btn-primary { background-color: #2b67f6; border: none; }
        .btn-primary:hover { background-color: #1a54d4; }
        .copy-btn { position: absolute; bottom: 5px; right: 10px; font-size: 12px; color: #2b67f6; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

<div class="container main-container">
    <div class="header-title">
        <h1>🔐 Cryptography Toolkit</h1>
        <p class="text-muted">Đồ án thực hành: Symmetric, Asymmetric & Hashing</p>
    </div>

    <ul class="nav nav-pills justify-content-center mb-4" id="pills-tab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="pills-sym-tab" data-bs-toggle="pill" data-bs-target="#pills-sym">Symmetric</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="pills-asym-tab" data-bs-toggle="pill" data-bs-target="#pills-asym">Asymmetric</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="pills-hash-tab" data-bs-toggle="pill" data-bs-target="#pills-hash">Hash Functions</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        <div class="tab-pane fade show active" id="pills-sym">
            <div class="crypto-section">
                <h4>Mã hóa Đối xứng</h4>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Thuật toán</label>
                        <select id="symAlgo" class="form-select">
                            <option value="AES">AES (CBC Mode)</option>
                            <option value="DES">DES</option>
                            <option value="3DES">3DES</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Secret Key</label>
                        <div class="input-group">
                            <input type="text" id="symKey" class="form-control" placeholder="Nhập key hoặc random">
                            <button class="btn btn-outline-secondary" onclick="generateRandomKey()">Gen Key</button>
                        </div>
                        <small class="text-muted">AES: 16/24/32 ký tự.</small>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Dữ liệu đầu vào (Plaintext hoặc Base64 Ciphertext)</label>
                        <textarea id="symInput" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="col-md-6">
                        <button class="btn btn-primary w-100" onclick="doSym('encrypt')">Mã hóa</button>
                    </div>
                    <div class="col-md-6">
                        <button class="btn btn-dark w-100" onclick="doSym('decrypt')">Giải mã</button>
                    </div>
                </div>
                <div class="result-box" id="symRes">---<a class="copy-btn" onclick="copy('symRes')">Copy</a></div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-asym">
            <div class="crypto-section">
                <h4>Mã hóa Bất đối xứng (RSA)</h4>
                <button class="btn btn-outline-primary mb-3" onclick="genRSA()">Tạo cặp khóa mới</button>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label>Public Key</label>
                        <textarea id="pubK" class="form-control" rows="4" readonly></textarea>
                    </div>
                    <div class="col-md-6">
                        <label>Private Key</label>
                        <textarea id="privK" class="form-control" rows="4" readonly></textarea>
                    </div>
                    <div class="col-12">
                        <input type="text" id="asymInput" class="form-control" placeholder="Nhập văn bản...">
                    </div>
                    <div class="col-md-6">
                        <button class="btn btn-primary w-100" onclick="doAsym('encrypt')">RSA Encrypt</button>
                    </div>
                    <div class="col-md-6">
                        <button class="btn btn-dark w-100" onclick="doAsym('decrypt')">RSA Decrypt</button>
                    </div>
                </div>
                <div class="result-box" id="asymRes">---<a class="copy-btn" onclick="copy('asymRes')">Copy</a></div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-hash">
            <div class="crypto-section">
                <h4>Hàm băm (Hash Functions)</h4>
                <input type="text" id="hashInput" class="form-control mb-3" placeholder="Nhập chuỗi cần băm...">
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" onclick="doHash('MD5')">MD5</button>
                    <button class="btn btn-primary" onclick="doHash('SHA256')">SHA256</button>
                </div>
                <div class="result-box" id="hashRes">Kết quả sẽ hiển thị ở đây...<a class="copy-btn" onclick="copy('hashRes')">Copy</a></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function api(url, data) {
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        return await res.json();
    }

    async function doSym(action) {
        const algo = document.getElementById('symAlgo').value;
        const d = await api('/api/symmetric', {
            algo: algo, action: action, 
            input: document.getElementById('symInput').value,
            key: document.getElementById('symKey').value
        });
        document.getElementById('symRes').innerText = d.result || d.error;
    }

    async function doHash(algo) {
        const d = await api('/api/hash', {algo, input: document.getElementById('hashInput').value});
        document.getElementById('hashRes').innerText = d.result || d.error;
    }

    async function genRSA() {
        const d = await api('/api/asymmetric/genkeys', {});
        document.getElementById('pubK').value = d.pub_key;
        document.getElementById('privK').value = d.priv_key;
    }

    async function doAsym(action) {
        const d = await api('/api/asymmetric/process', {
            action, input: document.getElementById('asymInput').value,
            pub_key: document.getElementById('pubK').value,
            priv_key: document.getElementById('privK').value
        });
        document.getElementById('asymRes').innerText = d.result || d.error;
    }

    function generateRandomKey() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let key = "";
        for (let i = 0; i < 16; i++) key += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById('symKey').value = key;
    }

    function copy(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text);
        alert("Đã copy!");
    }
</script>
</body>
</html>
